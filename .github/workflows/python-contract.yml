name: Python contract tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: veka-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout exact PR head (not a synthetic merge ref)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact checkout
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run full regression suite
        run: python -m unittest discover -s tests -q
      - name: Validate research CLI paths
        run: |
          python -m veka international-audit --output /tmp/veka-international-audit.json
          python -m veka international-plan --output /tmp/veka-international-plan.json > /dev/null
          test -s /tmp/veka-international-plan.json
          python -m veka root-review C002 --output /tmp/veka-root-review.json > /dev/null
          test -s /tmp/veka-root-review.json
          python -m veka root-review C056 --format text > /dev/null
          python -m veka root-review C002 --format text --lang zh > /dev/null
          python -m veka root-review C002 --format text --lang pt-BR > /dev/null
          python -m veka borrowing-audit --output /tmp/veka-borrowing-audit.json > /dev/null
          python -m veka conversation-score --output /tmp/veka-conversation-score.json > /dev/null
          python -m veka conversation-session --help > /dev/null
          python -m veka lexical-risk --target ne --top 5 --candidates 2
          python -m veka extend "Mi sen ka ti ton mel yu."
          python -m veka extend "Mi dak-koin mel."
      - name: Validate spoken-aesthetics and no-audio listening packet
        run: |
          python -m veka aesthetics ma-li da dak --profile tonal > /dev/null
          python -m veka prosody "Mi pái mel." --profile tonal > /dev/null
          python -m veka prosody "Mi fok mel." --profile toneless > /dev/null
          python -m veka spoken-study-assign --participant CI01 --profile tonal --arm 0 --output "$RUNNER_TEMP/participant.csv" --researcher-key "$RUNNER_TEMP/researcher.csv" > /dev/null
          test -s "$RUNNER_TEMP/participant.csv"
          test -s "$RUNNER_TEMP/researcher.csv"
