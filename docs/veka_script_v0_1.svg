ily="DejaVu Sans" font-size="27" font-weight="700">VOWELS</text><rect x="90" y="836" width="114" height="83" rx="11" fill="#f4f8fc"/><g transform="translate(102 844) scale(1.4)"><path d="M17 5 V27 M17 15 H29" fill="none" stroke="#152c45" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="176" y="886" text-anchor="middle" fill="#234764" font-family="DejaVu Sans" font-size="26" font-weight="600">a</text><rect x="235" y="836" width="114" height="83" rx="11" fill="#f4f8fc"/><g transform="translate(247 844) scale(1.4)"><path d="M17 5 V27 M5 15 H17" fill="none" stroke="#152c45" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="321" y="886" text-anchor="middle" fill="#234764" font-family="DejaVu Sans" font-size="26" font-weight="600">e</text><rect x="380" y="836" width="114" height="83" rx="11" fill="#f4f8fc"/><g transform="translate(392 844) scale(1.4)"><path d="M17 5 V27" fill="none" stroke="#152c45" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="466" y="886" text-anchor="middle" fill="#234764" font-family="DejaVu Sans" font-size="26" font-weight="600">i</text><rect x="525" y="836" width="114" height="83" rx="11" fill="#f4f8fc"/><g transform="translate(537 844) scale(1.4)"><path d="M5 17 H29 M17 5 V17" fill="none" stroke="#152c45" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="611" y="886" text-anchor="middle" fill="#234764" font-family="DejaVu Sans" font-size="26" font-weight="600">o</text><rect x="670" y="836" width="114" height="83" rx="11" fill="#f4f8fc"/><g transform="translate(682 844) scale(1.4)"><path d="M5 12 H29 M17 12 V27" fill="none" stroke="#152c45" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="756" y="886" text-anchor="middle" fill="#234764" font-family="DejaVu Sans" font-size="26" font-weight="600">u</text><text x="845" y="819" text-anchor="start" fill="#25435e" font-family="DejaVu Sans" font-size="25" font-weight="600">Diphthongs: ai · au · oi</text><text x="845" y="864" text-anchor="start" fill="#53667a" font-family="DejaVu Sans" font-size="19" font-weight="400">Two vowel signs share the vowel compartment.</text><text x="845" y="894" text-anchor="start" fill="#53667a" font-family="DejaVu Sans" font-size="19" font-weight="400">Codas: n · l · s · k (small lower glyph).</text><rect x="90" y="957" width="1362" height="67" rx="10" fill="#ecf3fa"/><text x="113" y="986" text-anchor="start" fill="#253d54" font-family="DejaVu Sans" font-size="20" font-weight="700">Spelling rule:</text><text x="273" y="986" text-anchor="start" fill="#253d54" font-family="DejaVu Sans" font-size="20" font-weight="400">one sound = one sign; blocks never change pronunciation.</text><text x="113" y="1011" text-anchor="start" fill="#53667a" font-family="DejaVu Sans" font-size="16" font-weight="400">Level tone is unmarked; rising tone has a tick. Roman letters are the fallback orthography.</text></svg>